<defs><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs>
<rect class="p-box" x="10" y="88" width="170" height="64" rx="3"/>
<text class="t-api" x="95" y="114" text-anchor="middle">complete_task(answer)</text>
<text class="t-v" x="95" y="134" text-anchor="middle">called by agent a</text>
<path class="p-box" d="M310,64 L400,120 L310,176 L220,120 Z"/>
<text class="t-v" x="310" y="116" text-anchor="middle">open claims held</text>
<text class="t-v" x="310" y="132" text-anchor="middle">by teammates?</text>
<line class="p-edge" x1="180" y1="120" x2="216" y2="120" marker-end="url(#pb)"/>
<path class="p-edge" d="M310,64 V30 H836" marker-end="url(#pb)"/>
<text class="t-v" x="318" y="52" text-anchor="start">no</text>
<line class="p-edge" x1="400" y1="120" x2="436" y2="120" marker-end="url(#pb)"/>
<text class="t-v" x="406" y="112" text-anchor="start">yes</text>
<rect class="p-box" x="440" y="80" width="190" height="80" rx="3"/>
<text class="t-h" x="454" y="102" text-anchor="start">Record the call</text>
<text class="t-v" x="454" y="122" text-anchor="start">finishing := true; caller and</text>
<text class="t-v" x="454" y="140" text-anchor="start">claim-less agents stop</text>
<line class="p-edge" x1="630" y1="120" x2="666" y2="120" marker-end="url(#pb)"/>
<rect class="p-box" x="670" y="80" width="190" height="80" rx="3"/>
<text class="t-h" x="684" y="102" text-anchor="start">Claim holders finish</text>
<text class="t-v" x="684" y="122" text-anchor="start">only claimed writes;</text>
<text class="t-v" x="684" y="140" text-anchor="start">wal_intend refused</text>
<path class="p-edge" d="M860,120 H900 V52" marker-end="url(#pb)"/>
<text class="t-v" x="908" y="92" text-anchor="start">claims closed,</text>
<text class="t-v" x="908" y="108" text-anchor="start">released or</text>
<text class="t-v" x="908" y="124" text-anchor="start">expired (90 s)</text>
<rect class="p-key" x="840" y="10" width="150" height="40" rx="3"/>
<text class="t-h" x="915" y="35" text-anchor="middle">Run call; grade</text>
<text class="t-v" x="10" y="205" text-anchor="start">Without the log (L0), the first complete_task runs at once and ends the task.</text>
</svg>
