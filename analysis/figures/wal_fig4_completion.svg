<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-label="Agent a calls complete_task. If no teammate holds an open claim, the call runs and the task is graded. Otherwise the call is recorded and finishing starts: the caller and agents without claims stop, claim holders may only make their claimed writes and cannot post intents. When no open claims remain, the recorded call runs and the task is graded.">
<style>svg { background: #fbfcfd; }
/* SVG text and shapes */
.t-title { font: 600 16px "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", Arial, sans-serif; fill: #16202e; }
.t-body { font: 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #3e4a5c; }
.t-small { font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #5d6879; }
