<path class="ic-body" d="M853,74 V106 A22,7 0 0,0 897,106 V74"/><ellipse class="ic-body" cx="875" cy="74" rx="22" ry="7"/><path class="ic" d="M853,90 A22,7 0 0,0 897,90"/>
<text class="t-mono" x="875" y="145" text-anchor="middle">wal/&lt;task&gt;.jsonl</text>
<text class="t-small" x="875" y="162" text-anchor="middle">one line per entry</text>
