<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-label="Architecture of the write-ahead log. Three agent threads have no channel to each other; each calls wal_intend and wal_read on the log and execute_python on the code runner. In the harness process, the code runner sends reads straight to the AppWorld app databases and every write to the gate, commit, which checks the level rules under the log mutex, records a pending line, applies the write and appends a change entry, all forced to the log file on disk.">
<style>svg { background: #fbfcfd; }
