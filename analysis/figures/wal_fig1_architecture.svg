<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-ref"/></marker></defs>
<rect class="p-bound" x="16" y="44" width="144" height="470" rx="6"/>
<text class="t-bound" x="28" y="64" text-anchor="start">Agent threads</text>
<rect class="p-box" x="36" y="100" width="104" height="56" rx="3"/>
<text class="t-h" x="88" y="126" text-anchor="middle">Agent 1</text>
<text class="t-k" x="88" y="143" text-anchor="middle">a1</text>
<rect class="p-box" x="36" y="250" width="104" height="56" rx="3"/>
<text class="t-h" x="88" y="276" text-anchor="middle">Agent 2</text>
<text class="t-k" x="88" y="293" text-anchor="middle">a2</text>
<rect class="p-box" x="36" y="400" width="104" height="56" rx="3"/>
<text class="t-h" x="88" y="426" text-anchor="middle">Agent 3</text>
<text class="t-k" x="88" y="443" text-anchor="middle">a3</text>
<line class="p-none" x1="88" y1="156" x2="88" y2="250"/>
<rect class="p-mask" x="56" y="191.0" width="64" height="30" rx="0"/>
<text class="t-x" x="88" y="204.0" text-anchor="middle">×</text>
<text class="t-v" x="88" y="218.0" text-anchor="middle">no channel</text>
<line class="p-none" x1="88" y1="306" x2="88" y2="400"/>
<rect class="p-mask" x="56" y="341.0" width="64" height="30" rx="0"/>
<text class="t-x" x="88" y="354.0" text-anchor="middle">×</text>
<text class="t-v" x="88" y="368.0" text-anchor="middle">no channel</text>
<rect class="p-bound" x="318" y="20" width="538" height="520" rx="6"/>
<text class="t-bound" x="330" y="40" text-anchor="start">Harness process (one per task)</text>
<rect class="p-key" x="330" y="60" width="300" height="150" rx="3"/>
<text class="t-h" x="344" y="82" text-anchor="start">Write-ahead log</text>
<text class="t-bound" x="470" y="82" text-anchor="start">append-only</text>
<text class="t-k" x="344" y="108" text-anchor="start">entries</text>
<text class="t-v" x="420" y="108" text-anchor="start">intent · change · release</text>
<text class="t-k" x="344" y="132" text-anchor="start">cursor[a]</text>
<text class="t-v" x="420" y="132" text-anchor="start">last entry agent a has read</text>
<text class="t-k" x="344" y="156" text-anchor="start">claims[a]</text>
<text class="t-v" x="420" y="156" text-anchor="start">open claims {app, api, target}</text>
<text class="t-k" x="344" y="180" text-anchor="start">mutex</text>
<text class="t-v" x="420" y="180" text-anchor="start">one lock: reads, posts, commits</text>
<rect class="p-key" x="330" y="258" width="300" height="92" rx="3"/>
<text class="t-h" x="344" y="280" text-anchor="start">Gate</text>
<text class="t-api" x="384" y="280" text-anchor="start">commit(a, op)</text>
<text class="t-v" x="344" y="304" text-anchor="start">level rules: claim · catch-up · conflict</text>
<text class="t-v" x="344" y="324" text-anchor="start">pending line → apply op → change entry</text>
<text class="t-v" x="344" y="342" text-anchor="start">complete_task: logged, never checked</text>
<rect class="p-box" x="330" y="410" width="300" height="108" rx="3"/>
<text class="t-h" x="344" y="432" text-anchor="start">Code runner</text>
<text class="t-bound" x="446" y="432" text-anchor="start">(main thread)</text>
<rect class="p-fill" x="344" y="446" width="24" height="18" rx="2"/>
<rect class="p-fill" x="374" y="446" width="24" height="18" rx="2"/>
<rect class="p-fill" x="404" y="446" width="24" height="18" rx="2"/>
<rect class="p-fill" x="434" y="446" width="24" height="18" rx="2"/>
<text class="t-v" x="470" y="459" text-anchor="start">FIFO, one cell at a time</text>
<text class="t-v" x="344" y="486" text-anchor="start">each cell runs in its agent's shell;</text>
<text class="t-v" x="344" y="504" text-anchor="start">API calls dispatched by HTTP method</text>
<rect class="p-box" x="696" y="150" width="144" height="368" rx="3"/>
<text class="t-h" x="710" y="172" text-anchor="start">AppWorld world</text>
<path class="p-fill" d="M711.0,199.0 V229.0 A17.0,5 0 0,0 745.0,229.0 V199.0"/><ellipse class="p-fill" cx="728" cy="199.0" rx="17.0" ry="5"/>
<text class="t-k" x="756" y="218" text-anchor="start">spotify</text>
<path class="p-fill" d="M711.0,261.0 V291.0 A17.0,5 0 0,0 745.0,291.0 V261.0"/><ellipse class="p-fill" cx="728" cy="261.0" rx="17.0" ry="5"/>
<text class="t-k" x="756" y="280" text-anchor="start">venmo</text>
<path class="p-fill" d="M711.0,323.0 V353.0 A17.0,5 0 0,0 745.0,353.0 V323.0"/><ellipse class="p-fill" cx="728" cy="323.0" rx="17.0" ry="5"/>
<text class="t-k" x="756" y="342" text-anchor="start">gmail</text>
<path class="p-fill" d="M711.0,385.0 V415.0 A17.0,5 0 0,0 745.0,415.0 V385.0"/><ellipse class="p-fill" cx="728" cy="385.0" rx="17.0" ry="5"/>
<text class="t-k" x="756" y="404" text-anchor="start">…</text>
<text class="t-v" x="710" y="476" text-anchor="start">9 app databases</text>
<text class="t-v" x="710" y="494" text-anchor="start">457 APIs, in-process</text>
<path class="p-fill" d="M928.0,86.0 V138.0 A32.0,5 0 0,0 992.0,138.0 V86.0"/><ellipse class="p-fill" cx="960" cy="86.0" rx="32.0" ry="5"/>
<text class="t-k" x="960" y="160" text-anchor="middle">wal/&lt;task&gt;.jsonl</text>
<text class="t-v" x="960" y="177" text-anchor="middle">JSON Lines, fsync per line</text>
<line class="p-edge" x1="160" y1="108" x2="326" y2="108" marker-end="url(#pa)"/>
<text class="t-api" x="238" y="100" text-anchor="middle">wal_intend(plan, claims)</text>
<line class="p-edge" x1="330" y1="146" x2="164" y2="146" marker-end="url(#pa)"/>
<text class="t-api" x="240" y="162" text-anchor="middle">wal_read() → entries</text>
<line class="p-edge" x1="160" y1="446" x2="326" y2="446" marker-end="url(#pa)"/>
<text class="t-api" x="228" y="436" text-anchor="middle">execute_python(code)</text>
<circle class="p-num" cx="300" cy="446" r="8.5"/><text class="t-num" x="300" y="449.6" text-anchor="middle">1</text>
<line class="p-edge" x1="330" y1="486" x2="164" y2="486" marker-end="url(#pa)"/>
<text class="t-api" x="228" y="504" text-anchor="middle">stdout | Refused</text>
<circle class="p-num" cx="300" cy="486" r="8.5"/><text class="t-num" x="300" y="489.6" text-anchor="middle">7</text>
<line class="p-edge" x1="364" y1="410" x2="364" y2="354" marker-end="url(#pa)"/>
<circle class="p-num" cx="364" cy="381" r="8.5"/><text class="t-num" x="364" y="384.6" text-anchor="middle">2</text>
<text class="t-api" x="378" y="385" text-anchor="start">POST · PUT · PATCH · DELETE</text>
<line class="p-edge-ref" x1="604" y1="352" x2="604" y2="406" marker-end="url(#pr)"/>
<text class="t-vref" x="612" y="385" text-anchor="start">Refused</text>
<line class="p-edge" x1="480" y1="256" x2="480" y2="214" marker-end="url(#pa)" marker-start="url(#pa)"/>
<circle class="p-num" cx="480" cy="235" r="8.5"/><text class="t-num" x="480" y="238.6" text-anchor="middle">3</text>
<text class="t-v" x="494" y="239" text-anchor="start">check · append</text>
<line class="p-edge" x1="630" y1="300" x2="692" y2="300" marker-end="url(#pa)"/>
<circle class="p-num" cx="661" cy="300" r="8.5"/><text class="t-num" x="661" y="303.6" text-anchor="middle">5</text>
<line class="p-edge" x1="630" y1="470" x2="692" y2="470" marker-end="url(#pa)"/>
<text class="t-api" x="661" y="462" text-anchor="middle">GET</text>
<line class="p-edge" x1="630" y1="112" x2="924" y2="112" marker-end="url(#pa)"/>
<circle class="p-num" cx="700" cy="112" r="8.5"/><text class="t-num" x="700" y="115.6" text-anchor="middle">4</text>
<circle class="p-num" cx="722" cy="112" r="8.5"/><text class="t-num" x="722" y="115.6" text-anchor="middle">6</text>
<text class="t-v" x="800" y="104" text-anchor="middle">append + fsync</text>
<text class="t-h" x="872" y="250" text-anchor="start">Write path</text>
<circle class="p-num" cx="900" cy="274" r="8.5"/><text class="t-num" x="900" y="277.6" text-anchor="middle">1</text>
<text class="t-v" x="916" y="278" text-anchor="start">cell queued</text>
<circle class="p-num" cx="900" cy="300" r="8.5"/><text class="t-num" x="900" y="303.6" text-anchor="middle">2</text>
<text class="t-v" x="916" y="304" text-anchor="start">write → commit(a, op)</text>
<circle class="p-num" cx="900" cy="326" r="8.5"/><text class="t-num" x="900" y="329.6" text-anchor="middle">3</text>
<text class="t-v" x="916" y="330" text-anchor="start">rules checked</text>
<circle class="p-num" cx="900" cy="352" r="8.5"/><text class="t-num" x="900" y="355.6" text-anchor="middle">4</text>
<text class="t-v" x="916" y="356" text-anchor="start">pending line, fsync</text>
<circle class="p-num" cx="900" cy="378" r="8.5"/><text class="t-num" x="900" y="381.6" text-anchor="middle">5</text>
<text class="t-v" x="916" y="382" text-anchor="start">op applied to the app DB</text>
<circle class="p-num" cx="900" cy="404" r="8.5"/><text class="t-num" x="900" y="407.6" text-anchor="middle">6</text>
<text class="t-v" x="916" y="408" text-anchor="start">change entry, fsync</text>
<circle class="p-num" cx="900" cy="430" r="8.5"/><text class="t-num" x="900" y="433.6" text-anchor="middle">7</text>
<text class="t-v" x="916" y="434" text-anchor="start">result, or Refused</text>
<path class="p-bracket" d="M889,317 H883 V413 H889"/>
<text class="t-bound" transform="translate(877,365) rotate(-90)" text-anchor="middle">mutex held</text>
<text class="t-v" x="872" y="466" text-anchor="start">Reads (GET) go from the</text>
<text class="t-v" x="872" y="482" text-anchor="start">code runner straight to</text>
<text class="t-v" x="872" y="498" text-anchor="start">the app DB: no ②–⑥.</text>
</svg>
