<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Three agents never message each other. Each one posts intents to and reads the shared write-ahead log, and sends code cells to one code runner. The code runner sends reads straight to the AppWorld apps; every write goes through the gate, which checks the log, logs the change and either lets the write through or refuses it. The log is appended to a file on disk.">
<style>svg { background: #fbfcfd; }
/* SVG text and shapes */
.t-title { font: 600 16px "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", Arial, sans-serif; fill: #16202e; }
.t-body { font: 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #3e4a5c; }
.t-small { font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #5d6879; }
.t-mono { font: 500 13px "IBM Plex Mono", ui-monospace, Menlo, Consolas, "Courier New", monospace; fill: #16202e; }
.t-lbl { font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #3e4a5c; }
.t-lmono { font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, "Courier New", monospace; fill: #3e4a5c; }
.t-cap { font: 600 10.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; letter-spacing: .07em; fill: #5d6879; }
.t-acc { fill: #2a78d6; }
.t-ref { fill: #b3261e; }
.box { fill: #fbfcfd; stroke: #c9d1dc; stroke-width: 1.2; }
.box-key { fill: #fbfcfd; stroke: #2a78d6; stroke-width: 2; }
.gate { fill: #e2edfb; stroke: #2a78d6; stroke-width: 1.5; }
.card { fill: #e7ebf1; stroke: none; }
.refbar { fill: #fbe2df; stroke: none; }
.edge { stroke: #3e4a5c; stroke-width: 1.5; fill: none; }
.edge-ref { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.dot-on { fill: #2a78d6; }
.dot-part { fill: #fbfcfd; stroke: #2a78d6; stroke-width: 1.8; }
.dot-off { fill: #c9d1dc; }
.t-name { font: 600 14px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #16202e; }
.t-chip { font: 500 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #16202e; }
.t-glyph { font: 600 9px "IBM Plex Mono", ui-monospace, Menlo, Consolas, "Courier New", monospace; fill: #3e4a5c; }
.ic { fill: none; stroke: #3e4a5c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-body { fill: #e7ebf1; stroke: #3e4a5c; stroke-width: 1.6; }
.ic-solid { fill: #3e4a5c; }
.ic-acc { fill: #e2edfb; stroke: #2a78d6; stroke-width: 1.8; }
.ic-acc-line { fill: none; stroke: #2a78d6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ic-ok { fill: none; stroke: #22784a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ic-ref { fill: none; stroke: #b3261e; stroke-width: 2; stroke-linecap: round; }
.chip { fill: #fbfcfd; stroke: #c9d1dc; stroke-width: 1.2; }
.chip-ref { fill: #fbe2df; stroke: none; }
.badge-ref { fill: #fbe2df; stroke: #b3261e; stroke-width: 1.2; }
.edge-none { fill: none; stroke: #5d6879; stroke-width: 1.3; stroke-dasharray: 3 4; }
.arrowhead { fill: #3e4a5c; }
.arrowhead-ref { fill: #b3261e; }
</style>
<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker><marker id="m1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-ref"/></marker></defs>
<rect class="box" x="20" y="40" width="150" height="420" rx="12"/>
<text class="t-cap" x="95" y="66" text-anchor="middle">AGENTS</text>
