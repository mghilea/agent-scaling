<text class="t-lbl" x="95" y="405" text-anchor="middle">agent 3</text>
<path class="edge-none" d="M119,125 C150,125 150,245 119,245"/>
<circle class="badge-ref" cx="142.5" cy="185.0" r="10"/>
<line class="ic-ref" x1="138.0" y1="180.5" x2="147.0" y2="189.5"/><line class="ic-ref" x1="138.0" y1="189.5" x2="147.0" y2="180.5"/>
<path class="edge-none" d="M119,245 C150,245 150,365 119,365"/>
<circle class="badge-ref" cx="142.5" cy="305.0" r="10"/>
