<rect class="ic-body" x="405" y="388" width="60" height="13" rx="4"/><text class="t-glyph" x="435" y="398" text-anchor="middle">&lt;/&gt;</text><rect class="ic-body" x="405" y="404" width="60" height="13" rx="4"/><text class="t-glyph" x="435" y="414" text-anchor="middle">&lt;/&gt;</text><rect class="ic-body" x="405" y="420" width="60" height="13" rx="4"/><text class="t-glyph" x="435" y="430" text-anchor="middle">&lt;/&gt;</text>
